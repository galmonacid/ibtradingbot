[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "momentum-ml-bot"
version = "0.2.0"
description = "Risk-aware deterministic research baseline for a long-only momentum system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
public-data = ["pitindex==0.2.1", "yfinance==1.7.0"]
historical-data = ["exchange-calendars>=4.13,<5", "openpyxl>=3.1,<4", "pyarrow>=18.0,<24"]
research = ["numpy>=2.0,<3", "scikit-learn>=1.7,<1.9"]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
momentum-sample-pipeline = "src.cli.sample_pipeline:main"
momentum-research-pipeline = "src.cli.research_pipeline:main"
momentum-validation-pipeline = "src.cli.validation_pipeline:main"
momentum-public-reconstructed = "src.cli.public_reconstructed:main"
momentum-public-daily-prices = "src.cli.public_prices:main"
momentum-historical-producer = "src.cli.historical_producer:main"
momentum-historical-build = "src.cli.historical_build:main"
momentum-git-source-snapshot = "src.cli.git_source_snapshot:main"
momentum-tiingo-plan = "src.cli.tiingo_plan:main"
momentum-native-validation = "src.cli.native_validation:main"
momentum-v2-validation = "src.cli.v2_validation:main"
momentum-r3-feasibility = "src.cli.r3_feasibility:main"
momentum-r3-contract = "src.cli.r3_contract:main"
momentum-r3-dataset = "src.cli.r3_dataset:main"
momentum-r3-evidence = "src.cli.r3_evidence:main"
momentum-r3-development = "src.cli.r3_development:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
