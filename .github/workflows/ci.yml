name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
      - run: mypy src
      - run: python -m build
      - run: momentum-sample-pipeline --config config.example.yaml
      - run: >-
          momentum-research-pipeline
          --config config.example.yaml
          --data data/sample/research_daily_bars.csv
          --universe data/sample/seed_universe.csv
          --calendar data/sample/us_sessions.csv
          --corporate-actions data/sample/corporate_actions.csv
          --run-timestamp 2026-09-07T00:00:00+00:00
